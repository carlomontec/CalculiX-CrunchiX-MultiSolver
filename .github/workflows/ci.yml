name: CI Multi-Solver Matrix

on:
  push:
    branches: [ master, main, 'fix/**', 'fix_*', 'feat/**' ]
  pull_request:
    branches: [ master, main, 'fix/**', 'fix_*', 'feat/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. macOS (Apple Silicon arm64) - Native Apple Accelerate & SPOOLES
  # ============================================================================
  macos:
    name: macOS (Apple Accelerate)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install gcc arpack cmake ninja libomp

      - name: Configure CMake
        run: |
          cmake -B build_accelerate -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCX_USE_ACCELERATE=ON \
            -DCCX_USE_SPOOLES=OFF \
            -DCCX_USE_MUMPS=OFF \
            -DCCX_USE_ARPACK=ON

      - name: Build CalculiX
        run: |
          cmake --build build_accelerate -j$(sysctl -n hw.ncpu)

      - name: Run Verification Test Suite
        run: |
          export OMP_NUM_THREADS=1
          export OMP_STACKSIZE=128M
          
          # We add '|| true' so the CI step doesn't crash if tests fail, 
          # allowing us to extract the percentage anyway.
          OUTPUT=$(python3 test_NewLib/run_official_testsuite.py --solvers ACCELERATE --pattern "beam*" --max-workers $(sysctl -n hw.ncpu)) || true
          echo "$OUTPUT"
          
          # Extracts the final percentage from your "Overall Pass Rate: XX.X%" print statements
          RATE=$(echo "$OUTPUT" | grep -oEi '[0-9.]+%' | tail -n 1)
          echo "$RATE" > ACCELERATE.txt

      - name: Upload Accelerate Rate
        uses: actions/upload-artifact@v4
        with:
          name: rate-ACCELERATE
          path: ACCELERATE.txt

  # ============================================================================
  # 2. Linux x86_64 - MUMPS 5.x, Intel oneMKL PARDISO, and Legacy SPOOLES
  # ============================================================================
  linux:
    name: Linux ${{ matrix.os }} (${{ matrix.solver_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        solver: [mumps, pardiso, spooles]
        exclude:
          - os: ubuntu-24.04-arm
            solver: pardiso
        include:
          - solver: mumps
            solver_name: "MUMPS 5.x Open-Source"
            cmake_flags: "-DCCX_USE_MUMPS=ON -DCCX_USE_PARDISO=OFF -DCCX_USE_SPOOLES=OFF -DCCX_USE_ACCELERATE=OFF"
          - solver: pardiso
            solver_name: "Intel oneMKL PARDISO"
            cmake_flags: "-DCCX_USE_PARDISO=ON -DCCX_USE_MUMPS=OFF -DCCX_USE_SPOOLES=OFF -DCCX_USE_ACCELERATE=OFF"
          - solver: spooles
            solver_name: "SPOOLES 2.2 (System Lib)"
            cmake_flags: "-DCCX_USE_SPOOLES=ON -DCCX_USE_MUMPS=OFF -DCCX_USE_PARDISO=OFF -DCCX_USE_ACCELERATE=OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Base Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake ninja-build libarpack2-dev libopenblas-dev liblapack-dev

      - name: Install MUMPS Solver Package (if MUMPS)
        if: matrix.solver == 'mumps'
        run: |
          sudo apt-get install -y libmumps-seq-dev

      - name: Install SPOOLES Package (if SPOOLES)
        if: matrix.solver == 'spooles'
        run: |
          sudo apt-get install -y libspooles-dev

      - name: Install Intel oneMKL Repository (if PARDISO)
        if: matrix.solver == 'pardiso'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure CMake
        run: |
          cmake -B build_${{ matrix.solver }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }} \
            -DCCX_USE_ARPACK=ON

      - name: Build CalculiX
        run: |
          cmake --build build_${{ matrix.solver }} -j$(nproc)

      - name: Run Verification Test Suite
        run: |
          export OMP_NUM_THREADS=1
          export OMP_STACKSIZE=128M
          ulimit -s unlimited
          SOLVER_FLAG=$(echo "${{ matrix.solver }}" | tr '[:lower:]' '[:upper:]')
          
          OUTPUT=$(python3 test_NewLib/run_official_testsuite.py --solvers "$SOLVER_FLAG" --max-workers $(nproc)) || true
          echo "$OUTPUT"
          
          RATE=$(echo "$OUTPUT" | grep -oEi '[0-9.]+%' | tail -n 1)
          echo "$RATE" > ${SOLVER_FLAG}.txt

      - name: Upload Linux Rate
        uses: actions/upload-artifact@v4
        with:
          name: rate-${{ matrix.solver }}
          path: ${SOLVER_FLAG}.txt

  # ============================================================================
  # 3. Windows (MSYS2 / MinGW-w64 UCRT64) - MUMPS
  # ============================================================================
  windows:
    name: Windows MSYS2 (${{ matrix.solver_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: mumps
            solver_name: "MUMPS 5.x Open-Source"
            cmake_flags: "-DCCX_USE_MUMPS=ON -DCCX_USE_PARDISO=OFF -DCCX_USE_SPOOLES=OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-arpack
            mingw-w64-ucrt-x86_64-mumps
            mingw-w64-ucrt-x86_64-metis
            mingw-w64-ucrt-x86_64-scotch
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build CalculiX in MSYS2
        shell: msys2 {0}
        run: |
          cmake -B build_${{ matrix.solver }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/ucrt64" \
            ${{ matrix.cmake_flags }} \
            -DCCX_USE_ARPACK=ON \
            -DCCX_USE_ACCELERATE=OFF
          cmake --build build_${{ matrix.solver }} -j

      - name: Run Verification Test in MSYS2
        shell: msys2 {0}
        run: |
          export OMP_NUM_THREADS=1
          export PYTHONIOENCODING=utf8
          SOLVER_FLAG=$(echo "${{ matrix.solver }}" | tr '[:lower:]' '[:upper:]')
          python3 test_NewLib/run_official_testsuite.py --solvers "$SOLVER_FLAG" \
            --pattern "beam*"

      - name: Verify Standalone Execution & Install Script
        shell: pwsh
        run: |
          .\install.ps1 -Solver ${{ matrix.solver }} -NonInteractive


  update-badges:
    name: Update Gist Badges
    needs: [macos, linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Download all rates
        uses: actions/download-artifact@v4
        with:
          pattern: rate-*
          merge-multiple: true

      - name: Update Accelerate Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507 # <-- Replace with your actual Gist ID
          filename: accelerate.json
          label: Accelerate
          message: ${{ env.RATE }}
          color: yellow
          valColorRange: ${{ env.RATE }}
          maxColorRange: 100
          minColorRange: 50
        env:
          RATE: ${{ run: cat ACCELERATE.txt | tr -d '%' }}

      - name: Update MUMPS Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507 # <-- Replace with your actual Gist ID
          filename: mumps.json
          label: MUMPS 5.x
          message: ${{ env.RATE }}
          color: yellow
          valColorRange: ${{ env.RATE }}
          maxColorRange: 100
          minColorRange: 50
        env:
          RATE: ${{ run: cat MUMPS.txt | tr -d '%' }}

      - name: Update SPOOLES Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507 # <-- Replace with your actual Gist ID
          filename: spooles.json
          label: SPOOLES 2.2
          message: ${{ env.RATE }}
          color: yellow
          valColorRange: ${{ env.RATE }}
          maxColorRange: 100
          minColorRange: 50
        env:
          RATE: ${{ run: cat SPOOLES.txt | tr -d '%' }}

      - name: Update PARDISO Badge
        uses: Schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507 # <-- Replace with your actual Gist ID
          filename: pardiso.json
          label: oneMKL PARDISO
          message: ${{ env.RATE }}
          color: yellow
          valColorRange: ${{ env.RATE }}
          maxColorRange: 100
          minColorRange: 50
        env:
          RATE: ${{ run: cat PARDISO.txt | tr -d '%' }}