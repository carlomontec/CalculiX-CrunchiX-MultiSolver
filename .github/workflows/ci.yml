name: CI Multi-Solver Matrix

on:
  push:
    branches: [ main, 'release/**', 'fix/**', 'fix_*', 'feat/**' ]
  pull_request:
    branches: [ main, 'release/**', 'fix/**', 'fix_*', 'feat/**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. macOS (Apple Silicon arm64) - Native Apple Accelerate & SPOOLES
  # ============================================================================
  macos:
    name: macOS (Apple Accelerate)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew update
          brew install gcc arpack cmake ninja libomp

      - name: Configure CMake
        run: |
          cmake -B build_accelerate -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCCX_USE_ACCELERATE=ON \
            -DCCX_USE_SPOOLES=OFF \
            -DCCX_USE_MUMPS=OFF \
            -DCCX_USE_ARPACK=ON

      - name: Build CalculiX
        run: |
          cmake --build build_accelerate -j$(sysctl -n hw.ncpu)

      - name: Run Verification Test Suite
        run: |
          # Every deck is checked against Dhondt's .dat.ref/.frd.ref files.
          # The step fails if a deck does not pass and is not listed, with the
          # same status, in the job's known-failures file.
          set +e
          python3 test_NewLib/run_official_testsuite.py --solvers ACCELERATE --max-workers $(sysctl -n hw.ncpu) \
            --known-failures test_NewLib/ci_known_failures/upstream.txt \
            --known-failures test_NewLib/ci_known_failures/macos-accelerate.txt \
            --write-known-failures nonpassing-macos-accelerate.txt 2>&1 | tee suite.log
          STATUS=${PIPESTATUS[0]}
          set -e
          grep -oE 'Overall Pass Rate: [0-9.]+%' suite.log | tail -n 1 | grep -oE '[0-9.]+%' > ACCELERATE.txt || true
          exit $STATUS

      - name: Upload Accelerate Rate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-ACCELERATE
          path: ACCELERATE.txt

      - name: Upload non-passing decks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonpassing-macos-accelerate
          path: nonpassing-macos-accelerate.txt

  # ============================================================================
  # 2. Linux x86_64 - MUMPS 5.x, Intel oneMKL PARDISO, and Legacy SPOOLES
  # ============================================================================
  linux:
    name: Linux ${{ matrix.os }} (${{ matrix.solver_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        solver: [mumps, pardiso, spooles]
        exclude:
          - os: ubuntu-24.04-arm
            solver: pardiso
        include:
          - solver: mumps
            solver_name: "MUMPS 5.x Open-Source"
            cmake_flags: "-DCCX_USE_MUMPS=ON -DCCX_USE_PARDISO=OFF -DCCX_USE_SPOOLES=OFF -DCCX_USE_ACCELERATE=OFF"
            threads_per_job: 2
          - solver: pardiso
            solver_name: "Intel oneMKL PARDISO"
            cmake_flags: "-DCCX_USE_PARDISO=ON -DCCX_USE_MUMPS=OFF -DCCX_USE_SPOOLES=OFF -DCCX_USE_ACCELERATE=OFF"
            threads_per_job: 2
          - solver: spooles
            solver_name: "SPOOLES 2.2 (System Lib)"
            cmake_flags: "-DCCX_USE_SPOOLES=ON -DCCX_USE_MUMPS=OFF -DCCX_USE_PARDISO=OFF -DCCX_USE_ACCELERATE=OFF"
            # multithreaded SPOOLES is not reproducible; one solver thread
            # gives results identical to CalculiX 2.24
            threads_per_job: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Base Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake ninja-build libarpack2-dev libopenblas-dev liblapack-dev

      - name: Install MUMPS Solver Package (if MUMPS)
        if: matrix.solver == 'mumps'
        run: |
          sudo apt-get install -y libmumps-seq-dev

      - name: Install SPOOLES Package (if SPOOLES)
        if: matrix.solver == 'spooles'
        run: |
          sudo apt-get install -y libspooles-dev

      - name: Install Intel oneMKL Repository (if PARDISO)
        if: matrix.solver == 'pardiso'
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Configure CMake
        run: |
          cmake -B build_${{ matrix.solver }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }} \
            -DCCX_USE_ARPACK=ON

      - name: Build CalculiX
        run: |
          cmake --build build_${{ matrix.solver }} -j$(nproc)

      - name: Run Verification Test Suite
        run: |
          # See the macOS job: checked against Dhondt's reference files and
          # the job's known-failures file.
          ulimit -s unlimited
          SOLVER_FLAG=$(echo "${{ matrix.solver }}" | tr '[:lower:]' '[:upper:]')
          JOB=${{ matrix.os }}-${{ matrix.solver }}
          set +e
          python3 test_NewLib/run_official_testsuite.py --solvers "$SOLVER_FLAG" \
            --threads-per-job ${{ matrix.threads_per_job }} --max-workers $(nproc) \
            --known-failures test_NewLib/ci_known_failures/upstream.txt \
            --known-failures test_NewLib/ci_known_failures/$JOB.txt \
            --write-known-failures nonpassing-$JOB.txt 2>&1 | tee suite.log
          STATUS=${PIPESTATUS[0]}
          set -e
          # Combine OS and solver name to keep ARM and x64 separate
          grep -oE 'Overall Pass Rate: [0-9.]+%' suite.log | tail -n 1 | grep -oE '[0-9.]+%' > $JOB.txt || true
          exit $STATUS

      - name: Upload Linux Rate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-${{ matrix.os }}-${{ matrix.solver }}
          path: ${{ matrix.os }}-${{ matrix.solver }}.txt

      - name: Upload non-passing decks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonpassing-${{ matrix.os }}-${{ matrix.solver }}
          path: nonpassing-${{ matrix.os }}-${{ matrix.solver }}.txt

  # ============================================================================
  # 3. Windows (MSYS2 / MinGW-w64 UCRT64) - MUMPS
  # ============================================================================
  windows:
    name: Windows MSYS2 (${{ matrix.solver_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: mumps
            solver_name: "MUMPS 5.x Open-Source"
            cmake_flags: "-DCCX_USE_MUMPS=ON -DCCX_USE_PARDISO=OFF -DCCX_USE_SPOOLES=OFF"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openblas
            mingw-w64-ucrt-x86_64-arpack
            mingw-w64-ucrt-x86_64-mumps
            mingw-w64-ucrt-x86_64-metis
            mingw-w64-ucrt-x86_64-scotch
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build CalculiX in MSYS2
        shell: msys2 {0}
        run: |
          cmake -B build_${{ matrix.solver }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/ucrt64" \
            ${{ matrix.cmake_flags }} \
            -DCCX_USE_ARPACK=ON \
            -DCCX_USE_ACCELERATE=OFF
          cmake --build build_${{ matrix.solver }} -j

      - name: Run Verification Test in MSYS2
        # The runner stops at deck 98 of 635 on Windows (issue #1). Until that
        # is fixed this step may fail without failing the job; the failure
        # stays visible in the log and the run summary.
        continue-on-error: true
        shell: msys2 {0}
        run: |
          export PYTHONIOENCODING=utf8
          SOLVER_FLAG=$(echo "${{ matrix.solver }}" | tr '[:lower:]' '[:upper:]')
          python3 test_NewLib/run_official_testsuite.py --solvers "$SOLVER_FLAG" \
            --known-failures test_NewLib/ci_known_failures/upstream.txt \
            --known-failures test_NewLib/ci_known_failures/windows-${{ matrix.solver }}.txt

      - name: Verify Standalone Execution & Install Script
        shell: pwsh
        run: |
          .\install.ps1 -Solver ${{ matrix.solver }} -NonInteractive


  update-badges:
    name: Update Gist Badges
    needs: [macos, linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download all rates
        uses: actions/download-artifact@v4
        with:
          pattern: rate-*
          merge-multiple: true

      - name: Read Rates into Environment Variables
        run: |
          # Create empty files as a fallback
          touch ACCELERATE.txt ubuntu-24.04-mumps.txt ubuntu-24.04-arm-mumps.txt ubuntu-24.04-spooles.txt ubuntu-24.04-arm-spooles.txt ubuntu-24.04-pardiso.txt
          
          echo "RATE_ACCELERATE=$(cat ACCELERATE.txt | tr -d '%')" >> $GITHUB_ENV
          echo "RATE_MUMPS_X64=$(cat ubuntu-24.04-mumps.txt | tr -d '%')" >> $GITHUB_ENV
          echo "RATE_MUMPS_ARM=$(cat ubuntu-24.04-arm-mumps.txt | tr -d '%')" >> $GITHUB_ENV
          echo "RATE_SPOOLES_X64=$(cat ubuntu-24.04-spooles.txt | tr -d '%')" >> $GITHUB_ENV
          echo "RATE_SPOOLES_ARM=$(cat ubuntu-24.04-arm-spooles.txt | tr -d '%')" >> $GITHUB_ENV
          echo "RATE_PARDISO_X64=$(cat ubuntu-24.04-pardiso.txt | tr -d '%')" >> $GITHUB_ENV

      - name: Update Accelerate Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: accelerate.json
          label: Accelerate (macOS)
          message: ${{ env.RATE_ACCELERATE }}%
          valColorRange: ${{ env.RATE_ACCELERATE }}
          maxColorRange: 100
          minColorRange: 50

      - name: Update MUMPS x64 Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: mumps-x64.json
          label: MUMPS (x64)
          message: ${{ env.RATE_MUMPS_X64 }}%
          valColorRange: ${{ env.RATE_MUMPS_X64 }}
          maxColorRange: 100
          minColorRange: 50

      - name: Update MUMPS ARM Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: mumps-arm.json
          label: MUMPS (ARM)
          message: ${{ env.RATE_MUMPS_ARM }}%
          valColorRange: ${{ env.RATE_MUMPS_ARM }}
          maxColorRange: 100
          minColorRange: 50

      - name: Update SPOOLES x64 Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: spooles-x64.json
          label: SPOOLES (x64)
          message: ${{ env.RATE_SPOOLES_X64 }}%
          valColorRange: ${{ env.RATE_SPOOLES_X64 }}
          maxColorRange: 100
          minColorRange: 50

      - name: Update SPOOLES ARM Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: spooles-arm.json
          label: SPOOLES (ARM)
          message: ${{ env.RATE_SPOOLES_ARM }}%
          valColorRange: ${{ env.RATE_SPOOLES_ARM }}
          maxColorRange: 100
          minColorRange: 50

      - name: Update PARDISO Badge
        uses: Schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: c3df672908389cd64cb1fb8c1133f507
          filename: pardiso-x64.json
          label: PARDISO (x64)
          message: ${{ env.RATE_PARDISO_X64 }}%
          valColorRange: ${{ env.RATE_PARDISO_X64 }}
          maxColorRange: 100
          minColorRange: 50